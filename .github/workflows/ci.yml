name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on a push. Work lands straight on main, so that run is the only one a commit ever
  # gets: cancelling it because a second commit arrived would leave the first unvalidated.
  # Superseded PR runs are still fair game.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: "1.7.12"
  CHECK_JSONSCHEMA_VERSION: "0.38.0"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one file whose breakage is silent: an invalid dependabot.yml disables
      # Dependabot entirely, with no error anywhere.
      - name: Validate workflows and Dependabot config
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color .github/workflows/*.yml
          rm -f ./actionlint
          python -m pip install --quiet "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}"
          check-jsonschema --schemafile https://json.schemastore.org/dependabot-2.0.json \
            .github/dependabot.yml

      # No `version:` — pnpm/action-setup reads the one pinned by `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @glassys/protocol --filter @glassys/adapter-contract --filter @glassys/adapter-cursor --filter @glassys/adapter-claude --filter @glassys/adapter-opencode --filter @glassys/adapter-gemini --filter @glassys/adapter-codex --filter @glassys/adapter-acp run build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
