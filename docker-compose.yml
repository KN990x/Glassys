services:
  glassys:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      GLASSYS_DATA_DIR: /data
      GLASSYS_WEB_DIR: /app/web/dist
      GLASSYS_BIND: 0.0.0.0
      # Blank interpolations are stripped at process boot so the SDK can use a mounted login store.
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    volumes:
      - glassys-data:/data
      - ${GLASSYS_WORKSPACE:-./workspace}:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  glassys-data:
